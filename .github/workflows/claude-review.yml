name: Claude Code Review (Reusable)

on:
  workflow_call:
    inputs:
      no-nit:
        description: 'Suppress nit-level feedback (style, naming, theoretical edge cases)'
        type: boolean
        default: true
      trigger-method:
        description: 'When the review fires. "auto" runs on every push. "comment" runs only when an authorized commenter types /claude-review on the PR.'
        type: string
        default: 'auto'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      (inputs.trigger-method == 'auto'
        && github.event_name == 'pull_request'
        && github.event.pull_request.draft == false) ||
      (inputs.trigger-method == 'comment'
        && github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Resolve PR ref
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER=${{ github.event.issue.number }}
            PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Acknowledge trigger
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1

      - name: Check for WIP commit
        id: check-wip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Last commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == \[wip\]* ]] || [[ "$COMMIT_MSG" == \[WIP\]* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping review: commit marked as work in progress"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        if: steps.check-wip.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Before running the review, read ALL existing review comment threads on this PR using:
              gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments --paginate
              gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews --paginate

            Build a dismissed-issues list: for each comment thread where the PR author replied dismissing, explaining, or acknowledging the concern (e.g. "intentional", "not relevant", "will address later", "by design"), or where the thread was resolved, record the file, line range, and issue summary. These issues are CLOSED and must NOT be re-raised.

            When reviewing, do NOT re-raise any dismissed issue, even if you independently consider it a real problem. Match by semantic similarity — e.g. "TLS verification disabled" and "SSL cert check bypassed" are the same issue. The only exception: new code in a DIFFERENT file/function introducing a new instance of a dismissed pattern.

            Now run the review:
            /code-review:code-review ${{ github.repository }}/pull/${{ env.PR_NUMBER }}
            ${{ inputs.no-nit == true && 'No-nit mode: Only flag substantive issues — bugs, security vulnerabilities, correctness errors, significant design concerns. Skip style preferences, naming nits, theoretical edge cases unlikely in practice, minor refactoring suggestions. If in doubt, do not comment.' || '' }}

            After the plugin completes, post the findings as inline review comments:

            ── Posting ──
            Signature line — append to every top-level comment body and every review summary body, on its own lines after a blank line and a horizontal rule:

            ---
            ${{ env.SIGNATURE_LINE }}

            If the review found NO issues:
            - Post a single top-level comment:
                gh pr comment ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --body "BODY_HERE"
            - The body should state no new issues were found, plus the signature.

            If the review found issues:
            - Build a JSON array of inline comment objects:
                [{ "path": "<file>", "position": <diff_position>, "body": "<emoji> <body>" }]
              Rules for each entry:
              - "position" is the 1-based line position within the unified diff (not the source line number)
              - One issue per comment
              - Natural tone, specific and actionable
              - Do NOT mention confidence scores or that this is automated
              - Emoji convention: 🚨 Critical · 🔒 Security · ⚡ Performance · ⚠️ Logic · ✨ Improvement
            - Submit ONE batched review via the GitHub Reviews API:
                gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews \
                  -f event=COMMENT \
                  -f body="SUMMARY_WITH_SIGNATURE" \
                  -f comments="[$COMMENTS_JSON]"
            - Do NOT use: gh pr review --approve or --request-changes

            ── Blocking behavior ──
            - If any 🚨 or 🔒 issue comments were posted: echo "CRITICAL_ISSUES_FOUND=true" >> $GITHUB_ENV
            - Otherwise: echo "CRITICAL_ISSUES_FOUND=false" >> $GITHUB_ENV
            - Always set CRITICAL_ISSUES_FOUND at the end
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKING_REVIEW: ${{ vars.BLOCKING_REVIEW || 'false' }}
          SIGNATURE_LINE: "🤖 *Reviewed by claude-review · config (commit ${{ github.sha }})*"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Check blocking review results
        if: steps.check-wip.outputs.skip != 'true' && vars.BLOCKING_REVIEW == 'true'
        run: |
          echo "Checking for critical issues..."
          echo "CRITICAL_ISSUES_FOUND: ${CRITICAL_ISSUES_FOUND:-unset}"

          if [ "${CRITICAL_ISSUES_FOUND:-false}" = "true" ]; then
            echo "❌ Critical issues found and blocking review is enabled. Failing the workflow."
            exit 1
          else
            echo "✅ No blocking issues found."
          fi
